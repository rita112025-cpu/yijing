<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>起卦 · 三枚硬幣法</title>
<style>
:root{
  --paper:#E9ECE3;
  --paper-deep:#DDE2D6;
  --ink:#1B2320;
  --ink-soft:#5A6660;
  --indigo:#3B4E66;
  --cinnabar:#B23A2E;
  --rule:#C3CABB;
  --yang-bar: var(--ink);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;
  line-height:1.7;
  -webkit-font-smoothing:antialiased;
  display:flex;
  justify-content:center;
}
.wrap{width:100%;max-width:520px;padding:28px 20px 64px;}
header{border-bottom:1px solid var(--rule);padding-bottom:14px;margin-bottom:26px;}
.eyebrow{
  font-family:ui-monospace,"SFMono-Regular",Menlo,monospace;
  font-size:11px;letter-spacing:.22em;color:var(--ink-soft);text-transform:uppercase;
}
h1{
  font-family:"Songti TC","Noto Serif TC","PMingLiU",serif;
  font-size:30px;font-weight:600;letter-spacing:.14em;margin:6px 0 2px;
}
.sub{font-size:13px;color:var(--ink-soft);margin:0;}
.ask{margin-bottom:22px;}
label{display:block;font-size:13px;color:var(--ink-soft);margin-bottom:6px;}
input[type=text]{
  width:100%;padding:11px 13px;border:1px solid var(--rule);border-radius:2px;
  background:#F3F5EE;color:var(--ink);font-size:15px;font-family:inherit;
}
input[type=text]:focus{outline:2px solid var(--indigo);outline-offset:1px;border-color:var(--indigo);}
.stage{
  border:1px solid var(--rule);background:#F3F5EE;
  padding:26px 22px;border-radius:2px;margin-bottom:18px;min-height:250px;
  display:flex;flex-direction:column;justify-content:center;
}
.stack{display:flex;flex-direction:column-reverse;gap:11px;}
.line{display:grid;grid-template-columns:26px 1fr 44px;align-items:center;gap:10px;}
.line .idx{
  font-family:ui-monospace,Menlo,monospace;font-size:11px;color:var(--ink-soft);text-align:right;
}
.bars{display:flex;gap:9px;height:11px;}
.bar{background:var(--yang-bar);flex:1;border-radius:1px;}
.line[data-yin="1"] .bars .bar{flex:0 0 calc(50% - 4.5px);}
.line .mark{
  font-family:ui-monospace,Menlo,monospace;font-size:11px;color:var(--ink-soft);letter-spacing:.06em;
}
.line[data-changing="1"] .bars .bar{background:var(--cinnabar);}
.line[data-changing="1"] .mark{color:var(--cinnabar);}
.line.enter{animation:draw .34s ease-out both;}
@keyframes draw{from{opacity:0;transform:translateY(7px) scaleX(.86);}to{opacity:1;transform:none;}}
.placeholder{color:var(--ink-soft);font-size:14px;text-align:center;}
.result{margin-top:4px;}
.name-row{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;}
.glyph{font-size:34px;line-height:1;}
.name{
  font-family:"Songti TC","Noto Serif TC","PMingLiU",serif;
  font-size:24px;font-weight:600;letter-spacing:.1em;
}
.no{font-family:ui-monospace,Menlo,monospace;font-size:12px;color:var(--ink-soft);}
.trigrams{font-size:13px;color:var(--indigo);margin:8px 0 0;}
.body-text{font-size:15px;margin:14px 0 0;}
.action{
  border-left:2px solid var(--indigo);padding-left:12px;margin-top:14px;
  font-size:14px;color:var(--indigo);
}
.moving{
  margin-top:16px;padding-top:14px;border-top:1px dashed var(--rule);
  font-size:14px;
}
.moving strong{color:var(--cinnabar);font-weight:600;}
.empty{
  font-size:14px;color:var(--ink-soft);
  border:1px dashed var(--rule);padding:12px;border-radius:2px;margin-top:12px;
}
.empty code{
  font-family:ui-monospace,Menlo,monospace;font-size:12px;
  background:var(--paper-deep);padding:1px 4px;
}
.cast{
  width:100%;padding:15px;border:none;border-radius:2px;
  background:var(--ink);color:var(--paper);
  font-family:inherit;font-size:16px;letter-spacing:.18em;cursor:pointer;
}
.cast:hover{background:#2C3733;}
.cast:disabled{background:var(--ink-soft);cursor:default;}
.cast:focus-visible{outline:2px solid var(--cinnabar);outline-offset:2px;}
.coins{
  text-align:center;font-family:ui-monospace,Menlo,monospace;font-size:12px;
  color:var(--ink-soft);height:18px;margin:10px 0 0;letter-spacing:.1em;
}
footer{
  margin-top:34px;padding-top:14px;border-top:1px solid var(--rule);
  font-size:12px;color:var(--ink-soft);
}
footer p{margin:0 0 6px;}
@media (prefers-reduced-motion:reduce){
  .line.enter{animation:none;}
}
</style>
</head>

  <header>

  </header>

  </div>
  <div class="stage" id="stage" aria-live="polite">
    <div class="placeholder" id="placeholder">心裡想著問題，按下方按鈕。</div>
    <div class="stack" id="stack" hidden></div>
    <div class="result" id="result" hidden></div>
  </div>
  <p class="coins" id="coins"></p>
  <button class="cast" id="cast">起 卦</button>
  <footer>
    <p>本頁為象徵性解讀工具，僅供個人自我反思參考，不構成醫療、法律、財務或心理診斷建議。</p>

  </footer>
</div>

/* ─────────────────────────────────────────────
   3. 擲幣：陽面 3、陰面 2，三枚相加得 6~9
      9 老陽（變）／8 少陰／7 少陽／6 老陰（變）
   ───────────────────────────────────────────── */
/* 6/7/8/9 → 爻狀態。純函式，測試從這裡進入 */
function lineFromValue(value){
  return {
    value,
    yang: value === 7 || value === 9,    // 本卦陰陽
    changing: value === 6 || value === 9 // 是否為變爻
  };
}

function throwLine(){
  const coins = [0,0,0].map(() => Math.random() < 0.5 ? 2 : 3);
  const value = coins.reduce((a,b) => a+b, 0);
  return Object.assign(lineFromValue(value), { coins });
}

const LINE_LABEL = { 6:"老陰 ✕", 7:"少陽", 8:"少陰", 9:"老陽 ○" };
const POSITION = ["初","二","三","四","五","上"];

/* 資料順序契約：lines[0]=初爻 … lines[5]=上爻。
   畫面的上下顛倒只由 CSS 的 column-reverse 負責，資料一律由下往上。 */

/* 由六爻算出本卦與之卦的二進位字串（由下往上） */
function toBinary(lines, transform){
  return lines.map(l => {
    if (transform && l.changing) return l.yang ? "0" : "1";
    return l.yang ? "1" : "0";
  }).join("");
}

function trigramsOf(binary){
  return {
    lower: TRIGRAMS[binary.slice(0,3)],
    upper: TRIGRAMS[binary.slice(3,6)]
  };
}

/* Unicode 卦符區塊由 U+4DC0 起，依文王卦序排列 */
function glyphOf(no){
  return no ? String.fromCodePoint(0x4DBF + no) : "";
}

/* ─────────────────────────────────────────────
   4. 畫面
   ───────────────────────────────────────────── */
const stackEl = document.getElementById("stack");
const resultEl = document.getElementById("result");
const placeholderEl = document.getElementById("placeholder");
const coinsEl = document.getElementById("coins");
const castBtn = document.getElementById("cast");

function renderLine(line, i){
  const el = document.createElement("div");
  el.className = "line enter";
  el.dataset.yin = line.yang ? "0" : "1";
  el.dataset.changing = line.changing ? "1" : "0";
  el.innerHTML =
    '<span class="idx">' + POSITION[i] + '</span>' +
    '<span class="bars">' + (line.yang ? '<i class="bar"></i>' : '<i class="bar"></i><i class="bar"></i>') + '</span>' +
    '<span class="mark">' + line.value + " " + LINE_LABEL[line.value] + '</span>';
  stackEl.appendChild(el);
}

function describe(binary, data){
  const t = trigramsOf(binary);
  const head = data
    ? '<div class="name-row"><span class="glyph">' + glyphOf(data.no) + '</span>' +
      '<span class="name">' + data.name + '</span>' +
      '<span class="no">第 ' + data.no + ' 卦</span></div>'
    : '<div class="name-row"><span class="name">尚未建入此卦</span></div>';
  const tri = '<p class="trigrams">上卦 ' + t.upper.symbol + ' ' + t.upper.name + '（' + t.upper.nature + '）' +
              '　下卦 ' + t.lower.symbol + ' ' + t.lower.name + '（' + t.lower.nature + '）</p>';
  const text = data
    ? '<p class="body-text">' + data.summary + '</p><p class="action">' + data.action + '</p>'
    : '<p class="empty">這一卦的說明還沒寫。到原始碼的 <code>HEXAGRAMS</code> 表新增 ' +
      '<code>"' + binary + '"</code> 這筆，就會顯示在這裡。</p>';
  return head + tri + text;
}

function renderResult(lines){
  const primary = toBinary(lines, false);
  const changed = toBinary(lines, true);
  const movingIdx = lines.map((l,i) => l.changing ? POSITION[i] : null).filter(Boolean);

  let html = describe(primary, HEXAGRAMS[primary]);

  if (movingIdx.length > 0){
    html += '<div class="moving"><p><strong>變爻：' + movingIdx.join("、") + '</strong>（硃砂標示）</p>';
    html += '<p style="margin:10px 0 0;color:var(--ink-soft);font-size:13px;">之卦</p>';
    html += describe(changed, HEXAGRAMS[changed]);
    html += '</div>';
  } else {
    html += '<div class="moving"><p>六爻皆不變，無之卦。看本卦即可。</p></div>';
  }

  resultEl.innerHTML = html;
  resultEl.hidden = false;
}

async function cast(fixedValues){
  castBtn.disabled = true;
  placeholderEl.hidden = true;
  resultEl.hidden = true;
  stackEl.hidden = false;
  stackEl.innerHTML = "";

  const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const delay = (reduce || fixedValues) ? 0 : 380;
  const lines = [];

  for (let i = 0; i < 6; i++){
    const line = fixedValues ? lineFromValue(fixedValues[i]) : throwLine();
    lines.push(line);
    coinsEl.textContent = fixedValues
      ? "指定值　第 " + POSITION[i] + " 爻 ＝ " + line.value
      : "第 " + POSITION[i] + " 爻　" + line.coins.join(" · ") + " ＝ " + line.value;
    renderLine(line, i);
    if (delay) await new Promise(r => setTimeout(r, delay));
  }

  if (!fixedValues) coinsEl.textContent = "";
  renderResult(lines);
  castBtn.disabled = false;
  castBtn.textContent = "再 起 一 卦";
}

castBtn.addEventListener("click", () => cast());


/* ─────────────────────────────────────────────
   5. 資料自我檢查（結果印在瀏覽器 Console）
   ───────────────────────────────────────────── */
function checkConsistency(){
  const byNo = {}, byName = {};
  const noCollision = [], nameCollision = [], roundTripFail = [];
  Object.keys(HEXAGRAMS).forEach(b => {
    const h = HEXAGRAMS[b];
    if (byNo[h.no]) noCollision.push({ no:h.no, binaries:[byNo[h.no], b] });
    else byNo[h.no] = b;
    if (byName[h.name]) nameCollision.push({ name:h.name, binaries:[byName[h.name], b] });
    else byName[h.name] = b;
  });
  Object.keys(byNo).forEach(no => {
    const b = byNo[no];
    if (!HEXAGRAMS[b] || String(HEXAGRAMS[b].no) !== String(no)) roundTripFail.push(no);
  });
  return {
    noCollision, nameCollision, roundTripFail,
    pass: noCollision.length === 0 && nameCollision.length === 0 && roundTripFail.length === 0
  };
}
const NAME_CHECK_EXEMPT = [];
function checkNameByTrigram(){
  return Object.keys(HEXAGRAMS).map(b => {
    const h = HEXAGRAMS[b];
    const t = trigramsOf(b);
    if (NAME_CHECK_EXEMPT.indexOf(b) !== -1) return { binary:b, name:h.name, status:"SKIP", why:"已列為例外" };
    if (h.name.charAt(1) === "為"){
      const ok = h.name.charAt(0) === t.upper.name &&
                 t.upper.name === t.lower.name &&
                 h.name.charAt(2) === t.upper.nature;
      return { binary:b, name:h.name, status: ok ? "PASS" : "FAIL", why:"純卦格式" };
    }
    const ok = h.name.charAt(0) === t.upper.nature && h.name.charAt(1) === t.lower.nature;
    return {
      binary:b, name:h.name, status: ok ? "PASS" : "FAIL",
      why:"應為 上" + t.upper.nature + " 下" + t.lower.nature
    };
  });
}
function allBinaries(){
  const out = [];
  for (let i = 0; i < 64; i++) out.push(i.toString(2).padStart(6, "0"));
  return out;
}
const KNOWN_SAMPLES = {
  "111111":{ no:1, name:"乾" },
  "000000":{ no:2, name:"坤" },
  "100010":{ no:3, name:"屯" },
  "010001":{ no:4, name:"蒙" },
  "111010":{ no:5, name:"需" },
  "010111":{ no:6, name:"訟" },
  "010000":{ no:7, name:"師" },
  "000010":{ no:8, name:"比" }
};
function checkKnownSamples(){
  return Object.keys(KNOWN_SAMPLES).map(b => {
    const expect = KNOWN_SAMPLES[b];
    const actual = HEXAGRAMS[b];
    if (!actual) return { binary:b, expect:expect.name + "/no." + expect.no, status:"PENDING", actual:"（尚未建入）" };
    const nameHit = actual.name.indexOf(expect.name) !== -1;
    const noHit = actual.no === expect.no;
    return {
      binary:b,
      expect: expect.name + "/no." + expect.no,
      status: (nameHit && noHit) ? "PASS" : "FAIL",
      actual: actual.name + "/no." + actual.no + (nameHit ? "" : "（名稱不符）") + (noHit ? "" : "（卦序不符）")
    };
  });
}
function checkTable(){
  const keys = Object.keys(HEXAGRAMS);
  const nos = keys.map(k => HEXAGRAMS[k].no);
  const invalidBinary = keys.filter(k => !/^[01]{6}$/.test(k));
  const invalidNo = nos.filter(n => !Number.isInteger(n) || n < 1 || n > 64);
  const duplicateNo = [...new Set(nos.filter((n,i) => nos.indexOf(n) !== i))];
  const missingNo = [];
  for (let n = 1; n <= 64; n++) if (!nos.includes(n)) missingNo.push(n);
  const missingBinary = allBinaries().filter(b => !(b in HEXAGRAMS));
  const report = {
    total: keys.length,
    uniqueBinary: new Set(keys).size,
    uniqueNo: new Set(nos).size,
    invalidBinary, invalidNo, duplicateNo,
    missingNo, missingBinary
  };
  report.pass = report.total === 64 &&
                report.uniqueNo === 64 &&
                missingBinary.length === 0 &&
                invalidBinary.length === 0 &&
                invalidNo.length === 0 &&
                duplicateNo.length === 0;
  return report;
}
const FIXED_CASES = [
  { id:"A", values:[7,7,7,7,7,7], primary:"111111", changed:"111111", note:"乾 → 乾（無變爻）" },
  { id:"B", values:[8,8,8,8,8,8], primary:"000000", changed:"000000", note:"坤 → 坤（無變爻）" },
  { id:"C", values:[9,9,9,9,9,9], primary:"111111", changed:"000000", note:"乾 → 坤（六爻皆變）" },
  { id:"D", values:[6,6,6,6,6,6], primary:"000000", changed:"111111", note:"坤 → 乾（六爻皆變）" },
  { id:"E", values:[7,8,8,8,8,8], primary:"100000", changed:"100000", note:"初爻為陽：下卦震、上卦坤" },
  { id:"F", values:[8,8,8,8,8,7], primary:"000001", changed:"000001", note:"上爻為陽：下卦坤、上卦艮" }
];
function runFixedCases(){
  return FIXED_CASES.map(c => {
    const lines = c.values.map(lineFromValue);
    const primary = toBinary(lines, false);
    const changed = toBinary(lines, true);
    const moving = lines.filter(l => l.changing).length;
    const expectMoving = c.values.filter(v => v === 6 || v === 9).length;
    return {
      case: c.id, note: c.note,
      primary, changed, moving,
      pass: primary === c.primary && changed === c.changed && moving === expectMoving
    };
  });
}
(function selfCheck(){
  const t = checkTable();
  console.log("[HEXAGRAM CHECK]");
  console.log("Total: " + t.total + " / 64");
  console.log("Unique binary: " + t.uniqueBinary);
  console.log("Unique no: " + t.uniqueNo);
  console.log("Invalid binary: [" + t.invalidBinary.join(", ") + "]");
  console.log("Invalid no: [" + t.invalidNo.join(", ") + "]");
  console.log("Duplicate no: [" + t.duplicateNo.join(", ") + "]");
  console.log("Missing no (" + t.missingNo.length + "): [" + t.missingNo.join(", ") + "]");
  console.log("Missing binary (" + t.missingBinary.length + "):");
  t.missingBinary.forEach(b => {
    const tr = trigramsOf(b);
    console.log('  "' + b + '"  下卦' + tr.lower.name + '（' + tr.lower.nature + '）' +
                ' 上卦' + tr.upper.name + '（' + tr.upper.nature + '）');
  });
  console.log(t.pass ? "PASS: Hexagram table complete" : "FAIL: Hexagram table incomplete");
  console.log("[FIXED CASES]");
  const results = runFixedCases();
  results.forEach(r => console.log(
    (r.pass ? "PASS" : "FAIL") + "  " + r.case + "  " + r.note +
    "  本卦 " + r.primary + " → 之卦 " + r.changed + "  變爻 " + r.moving
  ));
  const logicPass = results.every(r => r.pass);
  console.log(logicPass ? "PASS: 轉換邏輯 6/6" : "FAIL: 轉換邏輯有案例未通過，先不要繼續補資料");
  console.log("[KNOWN SAMPLES]");
  const samples = checkKnownSamples();
  samples.forEach(s => console.log(
    s.status.padEnd(8) + s.binary + "  預期 " + s.expect + "　實際 " + s.actual
  ));
  const sampleFail = samples.filter(s => s.status === "FAIL").length;
  const samplePending = samples.filter(s => s.status === "PENDING").length;
  console.log(sampleFail > 0
    ? "FAIL: 已知樣本有 " + sampleFail + " 筆對不上，卦表可能被編錯"
    : "PASS: 已知樣本無衝突（" + samplePending + " 筆尚未建入，未納入判定）");
  console.log("[CONSISTENCY] binary ↔ no ↔ name");
  const c = checkConsistency();
  console.log("  no collision: " + JSON.stringify(c.noCollision));
  console.log("  name collision: " + JSON.stringify(c.nameCollision));
  console.log("  round-trip fail: [" + c.roundTripFail.join(", ") + "]");
  console.log(c.pass ? "PASS: 三向無衝突" : "FAIL: 三向一致性有衝突");
  console.log("[NAME ↔ TRIGRAM]");
  const nameRes = checkNameByTrigram();
  const nameFail = nameRes.filter(r => r.status === "FAIL");
  nameFail.forEach(r => console.log("  FAIL  " + r.binary + "  " + r.name + "  " + r.why));
  console.log(nameFail.length === 0
    ? "PASS: 卦名與上下卦象相符（" + nameRes.filter(r => r.status === "PASS").length + " 筆檢查）"
    : "FAIL: " + nameFail.length + " 筆卦名與上下卦象不符");
})();
