<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>起卦 · 三枚硬幣法</title>
<style>
:root{
  --paper:#E9ECE3;
  --paper-deep:#DDE2D6;
  --ink:#1B2320;
  --ink-soft:#5A6660;
  --indigo:#3B4E66;
  --cinnabar:#B23A2E;
  --rule:#C3CABB;
  --yang-bar: var(--ink);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;
  line-height:1.7;
  -webkit-font-smoothing:antialiased;
  display:flex;
  justify-content:center;
}
.wrap{width:100%;max-width:680px;padding:36px 28px 72px;}
header{border-bottom:1px solid var(--rule);padding-bottom:14px;margin-bottom:26px;}
.eyebrow{
  font-family:ui-monospace,"SFMono-Regular",Menlo,monospace;
  font-size:19px;letter-spacing:.22em;color:var(--ink-soft);text-transform:uppercase;
}
h1{
  font-family:"Songti TC","Noto Serif TC","PMingLiU",serif;
  font-size:42px;font-weight:600;letter-spacing:.14em;margin:6px 0 2px;
}
.sub{font-size:21px;color:var(--ink-soft);margin:0;}
.ask{margin-bottom:22px;}
label{display:block;font-size:21px;color:var(--ink-soft);margin-bottom:6px;}
input[type=text]{
  width:100%;padding:13px 15px;border:1px solid var(--rule);border-radius:2px;
  background:#F3F5EE;color:var(--ink);font-size:22px;font-family:inherit;
}
input[type=text]:focus{outline:2px solid var(--indigo);outline-offset:1px;border-color:var(--indigo);}
.stage{
  border:1px solid var(--rule);background:#F3F5EE;
  padding:26px 22px;border-radius:2px;margin-bottom:18px;min-height:250px;
  display:flex;flex-direction:column;justify-content:center;
}
.stack{display:flex;flex-direction:column-reverse;gap:11px;}
/* 第三欄要放得下一整行「9 老陽 ○」（約 97px） */
.line{display:grid;grid-template-columns:26px 1fr 104px;align-items:center;gap:10px;}
.line .idx{
  font-family:ui-monospace,Menlo,monospace;font-size:19px;color:var(--ink-soft);text-align:right;
}
.bars{display:flex;gap:9px;height:16px;}
.bar{background:var(--yang-bar);flex:1;border-radius:1px;}
.line[data-yin="1"] .bars .bar{flex:0 0 calc(50% - 4.5px);}
.line .mark{
  font-family:ui-monospace,Menlo,monospace;font-size:19px;color:var(--ink-soft);letter-spacing:.06em;
  white-space:nowrap;
}
.line[data-changing="1"] .bars .bar{background:var(--cinnabar);}
.line[data-changing="1"] .mark{color:var(--cinnabar);}
.line.enter{animation:draw .34s ease-out both;}
@keyframes draw{from{opacity:0;transform:translateY(7px) scaleX(.86);}to{opacity:1;transform:none;}}
.placeholder{color:var(--ink-soft);font-size:20px;text-align:center;}
.result{margin-top:4px;}
.question{
  margin:0 0 0.875rem;padding-bottom:0.75rem;border-bottom:1px dashed var(--rule);
  font-size:1.375rem;overflow-wrap:anywhere;
}
.name-row{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;}
.glyph{font-size:46px;line-height:1;}
.name{
  font-family:"Songti TC","Noto Serif TC","PMingLiU",serif;
  font-size:34px;font-weight:600;letter-spacing:.1em;
}
.no{font-family:ui-monospace,Menlo,monospace;font-size:20px;color:var(--ink-soft);}
.trigrams{font-size:21px;color:var(--indigo);margin:8px 0 0;}
.body-text{font-size:22px;margin:14px 0 0;}
.action{
  border-left:2px solid var(--indigo);padding-left:12px;margin-top:14px;
  font-size:21px;color:var(--indigo);
}
.moving{
  margin-top:16px;padding-top:14px;border-top:1px dashed var(--rule);
  font-size:21px;
}
.moving strong{color:var(--cinnabar);font-weight:600;}
.changed-title{margin:0.625rem 0 0;font-size:1.25rem;color:var(--ink-soft);letter-spacing:.2em;}
.empty{
  font-size:20px;color:var(--ink-soft);
  border:1px dashed var(--rule);padding:12px;border-radius:2px;margin-top:12px;
}
.empty code{
  font-family:ui-monospace,Menlo,monospace;font-size:18px;
  background:var(--paper-deep);padding:1px 4px;
}
.cast{
  width:100%;padding:20px;border:none;border-radius:2px;
  background:var(--ink);color:var(--paper);
  font-family:inherit;font-size:24px;letter-spacing:.18em;cursor:pointer;
}
.cast:hover{background:#2C3733;}
.cast:disabled{background:var(--ink-soft);cursor:default;}
.cast:focus-visible{outline:2px solid var(--cinnabar);outline-offset:2px;}
.coins{
  text-align:center;font-family:ui-monospace,Menlo,monospace;font-size:20px;
  color:var(--ink-soft);min-height:34px;margin:10px 0 0;letter-spacing:.1em;
}
.cast-error{margin:0;font-size:1.3125rem;color:var(--cinnabar);}
.cast-error:not(:empty){margin:0 0 0.875rem;padding-left:0.75rem;border-left:2px solid var(--cinnabar);}
/* 給 AI 解讀：Button 用原生 <button>，提示詞框用可聚焦的 <pre><code>；新增尺寸一律 rem */
.ai-panel{
  margin:0 0 1.125rem;padding:1.375rem 1.375rem 1.5rem;
  border:1px solid var(--rule);border-radius:2px;background:#F3F5EE;
}
.ai-title{
  margin:0;font-family:"Songti TC","Noto Serif TC","PMingLiU",serif;
  font-size:1.75rem;font-weight:600;letter-spacing:.1em;
}
.ai-desc{margin:0.375rem 0 0;font-size:1.25rem;color:var(--ink-soft);}
.ai-copy{
  display:block;width:100%;min-height:2.75rem;margin:0.875rem 0 0;padding:0.625rem 1rem;
  border:1px solid var(--indigo);border-radius:2px;background:transparent;color:var(--indigo);
  font-family:inherit;font-size:1.3125rem;line-height:1.4;letter-spacing:.12em;cursor:pointer;
}
.ai-copy:hover{background:var(--paper);}
.ai-copy:active{background:var(--paper-deep);}
.ai-copy:focus-visible{outline:2px solid var(--cinnabar);outline-offset:3px;}
.copy-status{margin:0;font-size:1.1875rem;color:var(--indigo);}
.copy-status:not(:empty){margin-top:0.5rem;}
.copy-status[data-state="fail"]{color:var(--cinnabar);}
.ai-prompt-box{
  margin:0.875rem 0 0;max-height:24rem;overflow-y:auto;
  padding:0.875rem 1rem;border:1px solid var(--rule);border-radius:2px;
  background:var(--paper);color:var(--ink);
  font-family:inherit;font-size:1.1875rem;line-height:1.75;
  white-space:pre-wrap;overflow-wrap:anywhere;word-break:break-word;
}
.ai-prompt-box code{font:inherit;}
.ai-prompt-box:focus-visible{outline:2px solid var(--cinnabar);outline-offset:3px;}
.copy-buffer{position:fixed;top:0;left:-9999px;opacity:0;}
footer{
  margin-top:34px;padding-top:14px;border-top:1px solid var(--rule);
  font-size:20px;color:var(--ink-soft);
}
footer p{margin:0 0 6px;}
@media (prefers-reduced-motion:reduce){
  .line.enter{animation:none;}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">三枚硬幣法 · 六爻</div>
    <h1>起卦</h1>
    <p class="sub">由初爻往上，一爻擲一次。</p>
  </header>
  <div class="ask">
    <label for="q">想問的事（可留空，只存在這個畫面）</label>
    <input type="text" id="q" placeholder="例：這份工作要不要接" autocomplete="off" maxlength="200">
  </div>
  <div class="stage" id="stage" aria-live="polite">
    <div class="placeholder" id="placeholder">心裡想著問題，按下方按鈕。</div>
    <div class="stack" id="stack" hidden></div>
    <div class="result" id="result" hidden></div>
  </div>
  <section class="ai-panel" id="aiPanel" aria-labelledby="aiTitle" hidden>
    <h2 class="ai-title" id="aiTitle">給 AI 解讀</h2>
    <p class="ai-desc">已將本次起卦整理成 AI 可讀格式。本頁不會自動送出，貼到哪個 AI 由你決定。</p>
    <button type="button" class="ai-copy" id="copyAiPrompt">複製提示詞</button>
    <p class="copy-status" id="copyStatus" aria-live="polite"></p>
    <pre class="ai-prompt-box" id="aiPromptBox" tabindex="0" role="region" aria-label="AI 解讀提示詞"><code id="aiPrompt"></code></pre>
  </section>
  <p class="coins" id="coins"></p>
  <p class="cast-error" id="castError" role="alert"></p>
  <button class="cast" id="cast">起 卦</button>
  <footer>
    <p>本頁為象徵性解讀工具，僅供個人自我反思參考，不構成醫療、法律、財務或心理診斷建議。</p>
    <p>白話說明為自撰草稿，非《易經》原文，使用前請自行校對。</p>
    <p>隱私提醒：問題欄僅存於當前畫面，請避免輸入真實姓名、公司名稱、電話或地址。</p>
  </footer>
</div>

/* ─────────────────────────────────────────────
   3. 擲幣：陽面 3、陰面 2，三枚相加得 6~9
      9 老陽（變）／8 少陰／7 少陽／6 老陰（變）
   ───────────────────────────────────────────── */
/* 6/7/8/9 → 爻狀態。純函式，測試從這裡進入 */
function lineFromValue(value){
  return {
    value,
    yang: value === 7 || value === 9,    // 本卦陰陽
    changing: value === 6 || value === 9 // 是否為變爻
  };
}

function throwLine(){
  const coins = [0,0,0].map(() => Math.random() < 0.5 ? 2 : 3);
  const value = coins.reduce((a,b) => a+b, 0);
  return Object.assign(lineFromValue(value), { coins });
}

const LINE_LABEL = { 6:"老陰 ✕", 7:"少陽", 8:"少陰", 9:"老陽 ○" };
const POSITION = ["初","二","三","四","五","上"];

/* 資料順序契約：lines[0]=初爻 … lines[5]=上爻。
   畫面的上下顛倒只由 CSS 的 column-reverse 負責，資料一律由下往上。 */

/* 由六爻算出本卦與之卦的二進位字串（由下往上） */
function toBinary(lines, transform){
  return lines.map(l => {
    if (transform && l.changing) return l.yang ? "0" : "1";
    return l.yang ? "1" : "0";
  }).join("");
}

function trigramsOf(binary){
  return {
    lower: TRIGRAMS[binary.slice(0,3)],
    upper: TRIGRAMS[binary.slice(3,6)]
  };
}

/* Unicode 卦符區塊由 U+4DC0 起，依文王卦序排列 */
function glyphOf(no){
  return no ? String.fromCodePoint(0x4DBF + no) : "";
}

/* ─────────────────────────────────────────────
   4. 畫面
      innerHTML 只拼程式內部固定資料（HEXAGRAMS、TRIGRAMS、LINE_LABEL、POSITION）；
      使用者輸入（#q）一律走 textContent，見 renderQuestion() 與 renderAiPanel()
   ───────────────────────────────────────────── */
const stackEl = document.getElementById("stack");

function renderLine(line, i){
  const el = document.createElement("div");
  el.className = "line enter";
  el.dataset.yin = line.yang ? "0" : "1";
  el.dataset.changing = line.changing ? "1" : "0";
  el.innerHTML =
    '<span class="idx">' + POSITION[i] + '</span>' +
    '<span class="bars">' + (line.yang ? '<i class="bar"></i>' : '<i class="bar"></i><i class="bar"></i>') + '</span>' +
    '<span class="mark">' + line.value + " " + LINE_LABEL[line.value] + '</span>';
  stackEl.appendChild(el);
}

function describe(binary, data){
  const t = trigramsOf(binary);
  const head = data
    ? '<div class="name-row"><span class="glyph">' + glyphOf(data.no) + '</span>' +
      '<span class="name">' + data.name + '</span>' +
      '<span class="no">第 ' + data.no + ' 卦</span></div>'
    : '<div class="name-row"><span class="name">尚未建入此卦</span></div>';
  const tri = '<p class="trigrams">上卦 ' + t.upper.symbol + ' ' + t.upper.name + '（' + t.upper.nature + '）' +
              '　下卦 ' + t.lower.symbol + ' ' + t.lower.name + '（' + t.lower.nature + '）</p>';
  const text = data
    ? '<p class="body-text">' + data.summary + '</p><p class="action">' + data.action + '</p>'
    : '<p class="empty">這一卦的說明還沒寫。到原始碼的 <code>HEXAGRAMS</code> 表新增 ' +
      '<code>"' + binary + '"</code> 這筆，就會顯示在這裡。</p>';
  return head + tri + text;
}

/* 使用者輸入的出口：建立節點後用 textContent 填字，不經過任何 HTML 字串 */
function renderQuestion(question){
  const el = document.createElement("p");
  el.className = "question";
  el.textContent = "所問：" + question;
  return el;
}

function renderResult(lines, question){
  const primary = toBinary(lines, false);
  const changed = toBinary(lines, true);
  const movingIdx = lines.map((l,i) => l.changing ? POSITION[i] : null).filter(Boolean);

  let html = describe(primary, HEXAGRAMS[primary]);

  if (movingIdx.length > 0){
    html += '<div class="moving"><p><strong>變爻：' + movingIdx.join("、") + '</strong>（硃砂標示）</p>';
    html += '<p class="changed-title">之卦</p>';
    html += describe(changed, HEXAGRAMS[changed]);
    html += '</div>';
  } else {
    html += '<div class="moving"><p>六爻皆不變，無之卦。看本卦即可。</p></div>';
  }

  resultEl.innerHTML = html;
  if (question) resultEl.prepend(renderQuestion(question));
  resultEl.hidden = false;

  renderAiPanel(buildAiPrompt({
    question, lines,
    primaryBinary: primary, primary: HEXAGRAMS[primary],
    changedBinary: changed, changed: HEXAGRAMS[changed]
  }));
}

/* 給 AI 解讀面板：只顯示與複製文字，不送出任何資料 */
const COPY_LABEL = "複製提示詞";
let copyResetTimer = 0;

function setCopyStatus(message, state){
  copyStatusEl.textContent = message;
  copyStatusEl.dataset.state = state;
}

function renderAiPanel(prompt){
  aiPromptEl.textContent = prompt;
  aiPromptBoxEl.scrollTop = 0;
  aiPanelEl.hidden = false;
}

/* 再起一卦或出錯時呼叫：清掉舊提示詞，確保複製不到上一卦 */
function resetAiPanel(){
  aiPanelEl.hidden = true;
  aiPromptEl.textContent = "";
  clearTimeout(copyResetTimer);
  copyBtn.textContent = COPY_LABEL;
  setCopyStatus("", "");
}

/* Clipboard API 不可用或被拒時的傳統做法：暫時的唯讀 textarea ＋ execCommand("copy") */
function copyWithTextarea(text){
  const previousFocus = document.activeElement;
  const area = document.createElement("textarea");
  area.value = text;
  area.setAttribute("readonly", "");
  area.className = "copy-buffer";
  document.body.appendChild(area);
  area.select();
  area.setSelectionRange(0, text.length);
  let copied = false;
  try {
    copied = document.execCommand("copy");
  } catch (error) {
    copied = false;
  }
  area.remove();
  if (previousFocus && typeof previousFocus.focus === "function") previousFocus.focus();
  return copied;
}

async function copyAiPrompt(){
  const text = aiPromptEl.textContent;
  if (!text) return;
  let copied = false;
  if (navigator.clipboard && window.isSecureContext){
    try {
      await navigator.clipboard.writeText(text);
      copied = true;
    } catch (error) {
      console.warn("[copy] Clipboard API 失敗，改用傳統複製", error);
    }
  }
  if (!copied) copied = copyWithTextarea(text);
  if (aiPromptEl.textContent !== text) return; // 複製途中已再起一卦，不動新面板的狀態

  clearTimeout(copyResetTimer);
  if (copied){
    copyBtn.textContent = "已複製 ✓";
    setCopyStatus("已複製到剪貼簿。", "ok");
    copyResetTimer = setTimeout(() => {
      copyBtn.textContent = COPY_LABEL;
      setCopyStatus("", "");
    }, 1800);
  } else {
    copyBtn.textContent = COPY_LABEL;
    setCopyStatus("無法自動複製，請手動選取文字。", "fail");
  }
}

async function cast(fixedValues){
  castBtn.disabled = true;
  try {
    const question = questionInput.value.trim();
    castErrorEl.textContent = "";
    resetAiPanel();
    placeholderEl.hidden = true;
    resultEl.hidden = true;
    stackEl.hidden = false;
    stackEl.innerHTML = "";

    const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    const delay = (reduce || fixedValues) ? 0 : 380;
    const lines = [];

    for (let i = 0; i < 6; i++){
      const line = fixedValues ? lineFromValue(fixedValues[i]) : throwLine();
      lines.push(line);
      coinsEl.textContent = fixedValues
        ? "指定值　第 " + POSITION[i] + " 爻 ＝ " + line.value
        : "第 " + POSITION[i] + " 爻　" + line.coins.join(" · ") + " ＝ " + line.value;
      renderLine(line, i);
      if (delay) await new Promise(r => setTimeout(r, delay));
    }

    if (!fixedValues) coinsEl.textContent = "";
    renderResult(lines, question);
    castBtn.textContent = "再 起 一 卦";
  } catch (error) {
    /* 使用者只看到簡短提示；細節留在 Console */
    console.error("[cast] 起卦失敗", error);
    castErrorEl.textContent = "起卦過程發生錯誤，請再試一次。";
    coinsEl.textContent = "";
    stackEl.hidden = true;
    resultEl.hidden = true;
    resetAiPanel();
    placeholderEl.hidden = false;
  } finally {
    castBtn.disabled = false;
  }
}

castBtn.addEventListener("click", () => cast());
copyBtn.addEventListener("click", () => {
  copyAiPrompt().catch(error => {
    console.error("[copy] 複製失敗", error);
    setCopyStatus("無法自動複製，請手動選取文字。", "fail");
  });
});

/* 「老陰 ✕」→「老陰」：提示詞只寫爻名，不帶畫面上的標記符號 */
function lineName(value){
  return LINE_LABEL[value].split(" ")[0];
}

function lineForAi(line, i){
  return POSITION[i] + "爻：" + line.value + " " + lineName(line.value);
}

function hexagramForAi(title, binary, data, summaryTitle, actionTitle){
  const t = trigramsOf(binary);
  return [
    "【" + title + "】",
    data ? "第 " + data.no + " 卦　" + data.name : "尚未建入此卦資料",
    "卦象代碼：" + binary,
    "上卦：" + t.upper.symbol + " " + t.upper.name + "（" + t.upper.nature + "）",
    "下卦：" + t.lower.symbol + " " + t.lower.name + "（" + t.lower.nature + "）",
    "",
    "【" + summaryTitle + "】",
    data ? data.summary : "尚未建入",
    "",
    "【" + actionTitle + "】",
    data ? data.action : "尚未建入"
  ].join("\n");
}

/* lines 維持資料契約（lines[0]=初爻）；只有輸出【六爻結果】時才反轉成畫面的上→初順序 */

      : "不要只逐項解釋，要把六爻與本卦串成完整脈絡。",
    (hasMoving ? "【本頁白話摘要】【本頁行動提示】【之卦白話摘要】【之卦行動提示】"
               : "【本頁白話摘要】【本頁行動提示】") +

  ];

  const steps = [["核心卦意", q ? "先說明本卦對這個問題呈現的主要局勢。" : "先說明本卦呈現的主要局勢。"]];
  if (hasMoving){
    steps.push(["變爻", "說明哪些爻正在變，以及這些變化代表局勢的哪個部分正在轉折。"]);
    steps.push(["本卦 → 之卦", "分析局勢由本卦走向之卦的能量與方向，不要把兩卦當成完全無關的兩張牌。"]);

  steps.push(q

  const ORDER = ["一", "二", "三", "四", "五"];

  return [

    "",
    ...(hasMoving
      ? [hexagramForAi("之卦", changedBinary, changed, "之卦白話摘要", "之卦行動提示")]

function checkConsistency(){
  const byNo = {}, byName = {};
  const noCollision = [], nameCollision = [], roundTripFail = [];
  Object.keys(HEXAGRAMS).forEach(b => {
    const h = HEXAGRAMS[b];
    if (byNo[h.no]) noCollision.push({ no:h.no, binaries:[byNo[h.no], b] });
    else byNo[h.no] = b;
    if (byName[h.name]) nameCollision.push({ name:h.name, binaries:[byName[h.name], b] });
    else byName[h.name] = b;
  });
  Object.keys(byNo).forEach(no => {
    const b = byNo[no];
    if (!HEXAGRAMS[b] || String(HEXAGRAMS[b].no) !== String(no)) roundTripFail.push(no);
  });
  return {
    noCollision, nameCollision, roundTripFail,
    pass: noCollision.length === 0 && nameCollision.length === 0 && roundTripFail.length === 0
  };
}
const NAME_CHECK_EXEMPT = [];
function checkNameByTrigram(){
  return Object.keys(HEXAGRAMS).map(b => {
    const h = HEXAGRAMS[b];
    const t = trigramsOf(b);
    if (NAME_CHECK_EXEMPT.indexOf(b) !== -1) return { binary:b, name:h.name, status:"SKIP", why:"已列為例外" };
    if (h.name.charAt(1) === "為"){
      const ok = h.name.charAt(0) === t.upper.name &&
                 t.upper.name === t.lower.name &&
                 h.name.charAt(2) === t.upper.nature;
      return { binary:b, name:h.name, status: ok ? "PASS" : "FAIL", why:"純卦格式" };
    }
    const ok = h.name.charAt(0) === t.upper.nature && h.name.charAt(1) === t.lower.nature;
    return {
      binary:b, name:h.name, status: ok ? "PASS" : "FAIL",
      why:"應為 上" + t.upper.nature + " 下" + t.lower.nature
    };
  });
}

      failures.push({ binary, expectedNo: expected.no, actualNo, expectedName: expected.name, actualName });
    }
  });
  const passed = binaries.length - failures.length;
  return { total: binaries.length, passed, failures, pass: binaries.length === 64 && passed === 64 };
}
function checkTable(){
  const keys = Object.keys(HEXAGRAMS);
  const nos = keys.map(k => HEXAGRAMS[k].no);
  const invalidBinary = keys.filter(k => !/^[01]{6}$/.test(k));
  const invalidNo = nos.filter(n => !Number.isInteger(n) || n < 1 || n > 64);
  const duplicateNo = [...new Set(nos.filter((n,i) => nos.indexOf(n) !== i))];
  const missingNo = [];
  for (let n = 1; n <= 64; n++) if (!nos.includes(n)) missingNo.push(n);
  const missingBinary = allBinaries().filter(b => !(b in HEXAGRAMS));
  const report = {
    total: keys.length,
    uniqueBinary: new Set(keys).size,
    uniqueNo: new Set(nos).size,
    invalidBinary, invalidNo, duplicateNo,
    missingNo, missingBinary
  };
  report.pass = report.total === 64 &&
                report.uniqueNo === 64 &&
                missingBinary.length === 0 &&
                invalidBinary.length === 0 &&
                invalidNo.length === 0 &&
                duplicateNo.length === 0;
  return report;
}

  });
}

/* 擲幣抽樣：三枚公平硬幣相加，6／7／8／9 理論機率 1/8、3/8、3/8、1/8 */
function checkCoinToss(samples){
  const counts = { 6:0, 7:0, 8:0, 9:0 };
  let heads = 0, invalid = 0;
  for (let i = 0; i < samples; i++){
    const line = throwLine();
    line.coins.forEach(coin => { if (coin === 3) heads++; else if (coin !== 2) invalid++; });
    if (line.value in counts) counts[line.value]++; else invalid++;
  }
  const expected = { 6:1/8, 7:3/8, 8:3/8, 9:1/8 };
  const ratio = {};
  Object.keys(expected).forEach(v => { ratio[v] = counts[v] / samples; });
  const offBy = Object.keys(expected).filter(v => Math.abs(ratio[v] - expected[v]) > 0.03);
  const headRatio = heads / (samples * 3);
  return {
    samples, ratio, headRatio, invalid, offBy,
    pass: invalid === 0 && offBy.length === 0 && Math.abs(headRatio - 0.5) < 0.02
  };
}
